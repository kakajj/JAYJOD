<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#edf5ff"><meta name="application-name" content="JAYJOD เจจด"><meta name="apple-mobile-web-app-title" content="เจจด"><meta name="color-scheme" content="light"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="style.css"><title>JAYJOD เจจด</title></head><body><header><div><small>DAILY EXPENSES · v1.2.1</small><h1>JAYJOD เจจด</h1></div><button id="refresh" class="refresh" aria-label="รีเฟรชและตรวจสอบอัปเดต">↻</button></header><main><div class="toolbar" id="toolbar"><label>เดือน <input id="month" type="month"></label><label>มุมมอง <select id="view"><option value="calendar">เดือนปฏิทิน</option><option value="card">รอบบัตร</option></select></label></div><div id="cardFilter" hidden><label>บัตร <select id="card"></select></label><p id="period" class="muted"></p></div><div id="content"></div><p id="status" role="status" aria-live="polite"></p></main><div id="toast" role="status" hidden></div><nav aria-label="เมนู"><div class="nav-inner"><button data-page="home"><span aria-hidden="true">⌂</span>ภาพรวม</button><button data-page="list"><span aria-hidden="true">☷</span>รายการ</button><button id="add" class="primary nav-add" aria-label="เพิ่มรายจ่าย"><span aria-hidden="true">＋</span>เพิ่ม</button><button data-page="report"><span aria-hidden="true">▥</span>สรุป</button><button data-page="settings"><span aria-hidden="true">⚙</span>ตั้งค่า</button></div></nav><dialog id="editor"><form id="expenseForm"><div class="heading"><h2 id="editorTitle">เพิ่มรายจ่าย</h2><button type="button" data-close>ปิด</button></div><label>รายการ<input id="desc" required maxlength="200" list="suggestions" autocomplete="off"><datalist id="suggestions"></datalist></label><label>รูปแบบ<select id="entryMode"><option value="quick">บันทึกด่วน</option><option value="detailed">แยกรายละเอียด</option></select></label><label id="categoryWrap">ประเภท<select id="category"></select></label><section id="detailArea" hidden><div id="items"></div><button type="button" id="addItem">+ เพิ่มสินค้า</button><button type="button" id="applySplit">ใช้วิธีแบ่งด้านล่างกับทุกสินค้า</button><label>ส่วนลดท้ายใบเสร็จ (บาท)<input id="discount" inputmode="decimal" value="0"></label><label>ยอดตามใบเสร็จ (ไม่บังคับ)<input id="receiptTotal" inputmode="decimal"></label></section><label>ยอดรวม (บาท)<input id="amount" inputmode="decimal" required placeholder="0.00"></label><div class="two"><label>วันที่<input id="date" type="date" required></label><label>ช่องทางชำระ<select id="account" required></select></label></div><label>ผู้จ่ายเงินจริง<select id="payer"></select></label><label>แบ่งค่าใช้จ่าย<select id="split"><option value="equal">50 / 50</option><option value="me">คนแรกทั้งหมด</option><option value="partner">คนที่สองทั้งหมด</option><option value="custom">กำหนดจำนวนเงิน</option><option value="percent">เปอร์เซ็นต์</option><option value="units">จำนวนชิ้น (ราคาเท่ากัน)</option></select></label><div id="splitInputs" class="two"></div><div id="preview" class="panel" aria-live="polite"></div><label>หมายเหตุ (ไม่บังคับ)<textarea id="notes" rows="2"></textarea></label><section class="panel"><h3>รูปใบเสร็จ</h3><div class="actions"><label class="filebtn"><span>ถ่ายรูป</span><input id="camera" type="file" accept="image/*" capture="environment"></label><label class="filebtn"><span>เลือกรูป</span><input id="photos" type="file" accept="image/*" multiple></label></div><div id="photoList"></div><small>รูปเก็บในเครื่องและรวมใน Backup JSON</small></section><div class="two"><button class="primary" type="submit">บันทึก</button><button id="saveNext" type="submit" value="next">บันทึกและเพิ่มต่อ</button></div><p id="formError" role="alert" class="error"></p></form></dialog><script src="xlsx.js" defer></script><script src="extras.js" defer></script><dialog id="settleDialog"><form id="settleForm"><div class="heading"><h2 id="settleTitle">บันทึกโอนคืน</h2><button type="button" id="settleClose">ปิด</button></div><p id="settleHint" class="muted"></p><label>ผู้โอน<select id="settleFrom"></select></label><label>วันที่โอน<input type="date" id="settleDate" required></label><button type="button" id="settleAll" class="wide">คืนเต็มยอดทุกรายการ</button><div id="settleRows"></div><div class="panel"><small>ยอดโอนครั้งนี้</small><div class="total" id="settleTotal"></div></div><p id="settleError" class="error" role="alert"></p><button class="primary wide" type="submit">ยืนยันบันทึกโอนคืน</button></form></dialog><script src="settlement.js" defer></script><script src="app.js" defer></script></body></html>
